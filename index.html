<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBHM Slideshow</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #setup {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background: #111;
            gap: 15px;
        }

        #setup h1 {
            margin: 0 0 10px;
        }

        #connect {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        #slideshow {
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #photo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #folder {
            padding: 10px;
            font-size: 16px;
            width: 350px;
        }

        #start {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            max-width: 600px;
            text-align: center;
        }
    </style>
</head>

<body>

<div id="setup">
    <h1>PBHM Slideshow</h1>

    <div id="connection">
        <button id="connect">Connect Dropbox</button>
    </div>

    <div id="folderSetup" style="display:none;">
        <p>Enter the Dropbox folder path containing the photos:</p>
        <input id="folder" type="text" placeholder="/Event Photos">
        <br><br>
        <button id="start">Start Slideshow</button>
        <p id="status"></p>
    </div>
</div>

<div id="slideshow">
    <img id="photo" src="" alt="">
</div>

<script>
    const DROPBOX_APP_KEY = "pawngghorrbags0";
    const REDIRECT_URI = "https://pbhmelbourne.github.io/pbhm-slideshow/";

    function generateCodeVerifier() {
        const array = new Uint8Array(64);
        crypto.getRandomValues(array);
        return Array.from(array, byte => byte.toString(16).padStart(2, "0")).join("");
    }

    async function generateCodeChallenge(verifier) {
        const data = new TextEncoder().encode(verifier);
        const digest = await crypto.subtle.digest("SHA-256", data);

        return btoa(String.fromCharCode(...new Uint8Array(digest)))
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
    }

    async function exchangeCodeForToken(code) {
        const verifier = sessionStorage.getItem("dropbox_code_verifier");

        const response = await fetch("https://api.dropboxapi.com/oauth2/token", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body:
                "code=" + encodeURIComponent(code) +
                "&grant_type=authorization_code" +
                "&client_id=" + encodeURIComponent(DROPBOX_APP_KEY) +
                "&code_verifier=" + encodeURIComponent(verifier) +
                "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
        });

        const textResponse = await response.text();

        let data;

        try {
            data = JSON.parse(textResponse);
        } catch {
            throw new Error("Dropbox returned an unexpected response while connecting.");
        }

        if (!response.ok) {
            throw new Error(data.error_description || "Dropbox connection failed.");
        }

        sessionStorage.setItem("dropbox_access_token", data.access_token);
        sessionStorage.removeItem("dropbox_code_verifier");

        window.history.replaceState({}, document.title, REDIRECT_URI);

        showFolderSetup();
    }

    function showFolderSetup() {
        document.getElementById("connection").style.display = "none";
        document.getElementById("folderSetup").style.display = "block";
    }

    async function connectDropbox() {
        const verifier = generateCodeVerifier();
        const challenge = await generateCodeChallenge(verifier);

        sessionStorage.setItem("dropbox_code_verifier", verifier);

        const authUrl =
            "https://www.dropbox.com/oauth2/authorize" +
            "?client_id=" + encodeURIComponent(DROPBOX_APP_KEY) +
            "&response_type=code" +
            "&code_challenge=" + encodeURIComponent(challenge) +
            "&code_challenge_method=S256" +
            "&redirect_uri=" + encodeURIComponent(REDIRECT_URI);

        window.location.href = authUrl;
    }

    async function startSlideshow() {
        const folderPath = document.getElementById("folder").value.trim();
        const token = sessionStorage.getItem("dropbox_access_token");
        const status = document.getElementById("status");

        if (!folderPath) {
            status.textContent = "Please enter a Dropbox folder path.";
            return;
        }

        if (!token) {
            status.textContent = "Dropbox is not connected. Please reconnect.";
            return;
        }

        status.textContent = "Checking Dropbox folder...";

        try {
            const response = await fetch(
                "https://api.dropboxapi.com/2/files/list_folder",
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        path: folderPath
                    })
                }
            );

            const responseText = await response.text();

            let data;

            try {
                data = JSON.parse(responseText);
            } catch {
                throw new Error(
                    "Dropbox returned an unexpected response: " +
                    responseText.substring(0, 200)
                );
            }

            if (!response.ok) {
                throw new Error(
                    data.error_summary ||
                    data.error_description ||
                    "Could not access the Dropbox folder."
                );
            }

            const images = data.entries.filter(file =>
                file[".tag"] === "file" &&
                /\.(jpg|jpeg|png|gif)$/i.test(file.name)
            );

            if (images.length === 0) {
                status.textContent =
                    "Connected, but no image files were found in that folder.";
                return;
            }

            sessionStorage.setItem("dropbox_folder", folderPath);

            document.getElementById("setup").style.display = "none";
            document.getElementById("slideshow").style.display = "flex";

            loadPhotos(images);

        } catch (error) {
            status.textContent = "Error: " + error.message;
        }
    }

    async function loadPhotos(images) {
        const photo = document.getElementById("photo");
        let index = 0;

        async function showNext() {
            if (index >= images.length) {
                index = 0;
            }

            const file = images[index];

            try {
                const response = await fetch(
                    "https://api.dropboxapi.com/2/files/get_temporary_link",
                    {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " +
                                sessionStorage.getItem("dropbox_access_token"),
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            path: file.path_lower
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {
                    photo.src = data.link;
                }
            } catch (error) {
                console.error(error);
            }

            index++;
        }

        await showNext();

        setInterval(showNext, 5000);
    }

    document.getElementById("connect").addEventListener(
        "click",
        connectDropbox
    );

    document.getElementById("start").addEventListener(
        "click",
        startSlideshow
    );

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    if (code) {
        exchangeCodeForToken(code).catch(error => {
            document.getElementById("setup").innerHTML =
                "<h1>Dropbox connection failed</h1><p>" +
                error.message +
                "</p>";
        });
    } else if (sessionStorage.getItem("dropbox_access_token")) {
        showFolderSetup();
    }
</script>

</body>
</html>
