<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBHM Slideshow</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #setup {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background: #111;
            gap: 15px;
        }

        #setup h1 {
            margin: 0 0 10px;
        }

        #connect {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        #slideshow {
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #photo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

<div id="setup">
    <h1>PBHM Slideshow</h1>
    <button id="connect">Connect Dropbox</button>
</div>

<div id="slideshow">
    <img id="photo" src="" alt="">
</div>

<script>
    const DROPBOX_APP_KEY = "pcv91jk9ekwg3k5";
    const REDIRECT_URI = "https://pbhmelbourne.github.io/pbhm-slideshow/";

    function generateCodeVerifier() {
        const array = new Uint8Array(64);
        crypto.getRandomValues(array);
        return Array.from(array, byte => byte.toString(16).padStart(2, "0")).join("");
    }

    async function generateCodeChallenge(verifier) {
        const data = new TextEncoder().encode(verifier);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return btoa(String.fromCharCode(...new Uint8Array(digest)))
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
    }

    document.getElementById("connect").addEventListener("click", async () => {
        const verifier = generateCodeVerifier();
        const challenge = await generateCodeChallenge(verifier);

        sessionStorage.setItem("dropbox_code_verifier", verifier);

        const authUrl =
            "https://www.dropbox.com/oauth2/authorize" +
            "?client_id=" + encodeURIComponent(DROPBOX_APP_KEY) +
            "&response_type=code" +
            "&code_challenge=" + encodeURIComponent(challenge) +
            "&code_challenge_method=S256" +
            "&redirect_uri=" + encodeURIComponent(REDIRECT_URI);

        window.location.href = authUrl;
    });
</script>

</body>
</html>
