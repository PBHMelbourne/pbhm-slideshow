<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBHM Slideshow</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #slideshow {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("background.png.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        #photo {
            width: 60%;
            height: 70%;
            object-fit: contain;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 16px;
            z-index: 10;
        }

        #fullscreenButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
        }

        #status.hidden {
            display: none;
        }

        #fullscreenButton.hidden {
            display: none;
        }
    </style>
</head>

<body>

<div id="slideshow">

    <div id="status">
        Loading photos...
    </div>

    <img id="photo" src="" alt="">

    <button id="fullscreenButton">
        Enter Full Screen
    </button>

</div>

<script>

    const WORKER_URL =
        "https://pbhm-slideshow-api.orange-heart-72cd.workers.dev/photos?event=ferguson-plarre";

    let images = [];

    let currentIndex = 0;

    let slideshowTimer = null;

    let refreshTimer = null;


    async function getPhotos() {

        const response =
            await fetch(WORKER_URL);

        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not load photos."
            );

        }


        return data.photos.map(
            photo => ({
                name: photo.name,
                path_lower: photo.path,
                link: photo.link
            })
        );

    }


    async function displayNextPhoto() {

        if (images.length === 0) {
            return;
        }


        if (currentIndex >= images.length) {
            currentIndex = 0;
        }


        const photo =
            images[currentIndex];


        currentIndex++;


        document.getElementById(
            "photo"
        ).src = photo.link;

    }


    async function refreshImages() {

        try {

            const newImages =
                await getPhotos();


            const wasEmpty =
                images.length === 0;


            images =
                newImages;


            if (
                wasEmpty &&
                images.length > 0
            ) {

                document.getElementById(
                    "status"
                ).classList.add(
                    "hidden"
                );


                currentIndex = 0;


                await displayNextPhoto();


                slideshowTimer =
                    setInterval(
                        displayNextPhoto,
                        8000
                    );

            }


        } catch (error) {

            console.error(
                "Could not check for new photos:",
                error
            );

        }

    }


    async function startSlideshow() {

        const status =
            document.getElementById(
                "status"
            );


        try {

            status.textContent =
                "Loading photos...";


            images =
                await getPhotos();


            if (images.length === 0) {

                status.textContent =
                    "Waiting for photos...";


                refreshTimer =
                    setInterval(
                        refreshImages,
                        10000
                    );


                return;

            }


            status.classList.add(
                "hidden"
            );


            await displayNextPhoto();


            slideshowTimer =
                setInterval(
                    displayNextPhoto,
                    8000
                );


            refreshTimer =
                setInterval(
                    refreshImages,
                    10000
                );


        } catch (error) {

            status.textContent =
                "Unable to load photos.";

            console.error(
                error
            );

        }

    }


    document.getElementById(
        "fullscreenButton"
    ).addEventListener(
        "click",
        async function () {

            try {

                await document.documentElement.requestFullscreen();

                document.getElementById(
                    "fullscreenButton"
                ).classList.add(
                    "hidden"
                );

            } catch (error) {

                console.error(
                    "Could not enter full screen:",
                    error
                );

            }

        }
    );


    document.addEventListener(
        "fullscreenchange",
        function () {

            const button =
                document.getElementById(
                    "fullscreenButton"
                );


            if (
                !document.fullscreenElement
            ) {

                button.classList.remove(
                    "hidden"
                );

            }

        }
    );


    startSlideshow();

</script>

</body>
</html>
