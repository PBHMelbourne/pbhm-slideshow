<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBHM Slideshow</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #setup {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background: #111;
            gap: 15px;
        }

        #setup h1 {
            margin: 0 0 10px;
        }

        #connect {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        #slideshow {
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #photo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

<div id="setup">
    <h1>PBHM Slideshow</h1>
    <button id="connect">Connect Dropbox</button>
</div>

<div id="slideshow">
    <img id="photo" src="" alt="">
</div>

<script>
    const DROPBOX_APP_KEY = "pcv91jk9ekwg3k5";

    document.getElementById("connect").addEventListener("click", () => {
        alert("Dropbox connection will be added in the next step.");
    });
</script>

</body>
</html>
