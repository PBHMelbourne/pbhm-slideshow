<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBHM Slideshow</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #setup {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            background: #111;
            gap: 15px;
        }

        #setup h1 {
            margin: 0 0 10px;
        }

        #connect {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        #slideshow {
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            background-image: url("background.png.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        #photo {
            width: 60%;
            height: 70%;
            object-fit: contain;
        }

        #folder {
            padding: 10px;
            font-size: 16px;
            width: 350px;
        }

        #start {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            max-width: 600px;
            text-align: center;
        }

        #fullscreenButton,
        #exitFullscreenButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
        }

        #exitFullscreenButton {
            display: none;
        }
    </style>
</head>

<body>

<div id="setup">

    <h1>PBHM Slideshow</h1>

    <div id="connection">
        <button id="connect">
            Connect Dropbox
        </button>
    </div>

    <div id="folderSetup" style="display:none;">

        <p>
            Enter the Dropbox folder path containing the photos:
        </p>

        <input
            id="folder"
            type="text"
            placeholder="/Event Photos"
        >

        <br><br>

        <button id="start">
            Start Slideshow
        </button>

        <p id="status"></p>

    </div>

</div>

<div id="slideshow">

    <img id="photo" src="" alt="">

    <button id="fullscreenButton">
        Enter Full Screen
    </button>

    <button id="exitFullscreenButton">
        Exit Full Screen
    </button>

</div>

<script>

    const DROPBOX_APP_KEY = "pawngghorrbags0";

    const REDIRECT_URI =
        "https://pbhmelbourne.github.io/pbhm-slideshow/";

    let images = [];

    let currentIndex = 0;

    let slideshowTimer = null;

    let refreshTimer = null;


    function generateCodeVerifier() {

        const array = new Uint8Array(64);

        crypto.getRandomValues(array);

        return Array.from(
            array,
            byte => byte.toString(16).padStart(2, "0")
        ).join("");

    }


    async function generateCodeChallenge(verifier) {

        const data =
            new TextEncoder().encode(verifier);

        const digest =
            await crypto.subtle.digest(
                "SHA-256",
                data
            );

        return btoa(
            String.fromCharCode(
                ...new Uint8Array(digest)
            )
        )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");

    }


    async function exchangeCodeForToken(code) {

        const verifier =
            sessionStorage.getItem(
                "dropbox_code_verifier"
            );

        const response =
            await fetch(
                "https://api.dropboxapi.com/oauth2/token",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        "code=" +
                        encodeURIComponent(code) +

                        "&grant_type=authorization_code" +

                        "&client_id=" +
                        encodeURIComponent(
                            DROPBOX_APP_KEY
                        ) +

                        "&code_verifier=" +
                        encodeURIComponent(
                            verifier
                        ) +

                        "&redirect_uri=" +
                        encodeURIComponent(
                            REDIRECT_URI
                        )
                }
            );


        const textResponse =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(textResponse);

        } catch {

            throw new Error(
                "Dropbox returned an unexpected response while connecting."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error_description ||
                "Dropbox connection failed."
            );

        }


        sessionStorage.setItem(
            "dropbox_access_token",
            data.access_token
        );


        if (data.refresh_token) {

            sessionStorage.setItem(
                "dropbox_refresh_token",
                data.refresh_token
            );

        }


        sessionStorage.removeItem(
            "dropbox_code_verifier"
        );


        window.history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );


        showFolderSetup();

    }


    function showFolderSetup() {

        document.getElementById(
            "connection"
        ).style.display = "none";


        document.getElementById(
            "folderSetup"
        ).style.display = "block";

    }


    async function connectDropbox() {

        const verifier =
            generateCodeVerifier();


        const challenge =
            await generateCodeChallenge(
                verifier
            );


        sessionStorage.setItem(
            "dropbox_code_verifier",
            verifier
        );


        const authUrl =
            "https://www.dropbox.com/oauth2/authorize" +

            "?client_id=" +
            encodeURIComponent(
                DROPBOX_APP_KEY
            ) +

            "&response_type=code" +

            "&token_access_type=offline" +

            "&code_challenge=" +
            encodeURIComponent(
                challenge
            ) +

            "&code_challenge_method=S256" +

            "&redirect_uri=" +
            encodeURIComponent(
                REDIRECT_URI
            );


        window.location.href =
            authUrl;

    }


    async function getDropboxImages(folderPath) {

        const token =
            sessionStorage.getItem(
                "dropbox_access_token"
            );


        const response =
            await fetch(
                "https://api.dropboxapi.com/2/files/list_folder",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            path: folderPath
                        })
                }
            );


        const responseText =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(responseText);

        } catch {

            throw new Error(
                "Dropbox returned an unexpected response: " +
                responseText.substring(0, 200)
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error_summary ||
                data.error_description ||
                "Could not access the Dropbox folder."
            );

        }


        return data.entries.filter(
            file =>
                file[".tag"] === "file" &&
                /\.(jpg|jpeg|png|gif)$/i.test(
                    file.name
                )
        );

    }


    async function getTemporaryLink(file) {

        const token =
            sessionStorage.getItem(
                "dropbox_access_token"
            );


        const response =
            await fetch(
                "https://api.dropboxapi.com/2/files/get_temporary_link",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            path:
                                file.path_lower
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error_summary ||
                "Could not get photo link."
            );

        }


        return data.link;

    }


    async function displayNextPhoto() {

        if (images.length === 0) {
            return;
        }


        if (currentIndex >= images.length) {

            currentIndex = 0;

        }


        const file =
            images[currentIndex];


        currentIndex++;


        try {

            const link =
                await getTemporaryLink(
                    file
                );


            document.getElementById(
                "photo"
            ).src = link;


        } catch (error) {

            console.error(
                "Could not display photo:",
                error
            );

        }

    }


    async function refreshImages() {

        const folderPath =
            sessionStorage.getItem(
                "dropbox_folder"
            );


        if (!folderPath) {
            return;
        }


        try {

            const newImages =
                await getDropboxImages(
                    folderPath
                );


            const existingPaths =
                new Set(
                    images.map(
                        file =>
                            file.path_lower
                    )
                );


            const addedImages =
                newImages.filter(
                    file =>
                        !existingPaths.has(
                            file.path_lower
                        )
                );


            if (addedImages.length > 0) {

                images =
                    newImages;


                console.log(
                    "New photos detected:",
                    addedImages.length
                );

            } else {

                images =
                    newImages;

            }


        } catch (error) {

            console.error(
                "Could not check for new photos:",
                error
            );

        }

    }


    async function startSlideshow() {

        const folderPath =
            document.getElementById(
                "folder"
            ).value.trim();


        const token =
            sessionStorage.getItem(
                "dropbox_access_token"
            );


        const status =
            document.getElementById(
                "status"
            );


        if (!folderPath) {

            status.textContent =
                "Please enter a Dropbox folder path.";

            return;

        }


        if (!token) {

            status.textContent =
                "Dropbox is not connected. Please reconnect.";

            return;

        }


        status.textContent =
            "Checking Dropbox folder...";


        try {

            images =
                await getDropboxImages(
                    folderPath
                );


            if (images.length === 0) {

                status.textContent =
                    "Connected, but no image files were found in that folder.";

                return;

            }


            sessionStorage.setItem(
                "dropbox_folder",
                folderPath
            );


            document.getElementById(
                "setup"
            ).style.display = "none";


            document.getElementById(
                "slideshow"
            ).style.display = "flex";


            currentIndex = 0;


            await displayNextPhoto();


            slideshowTimer =
                setInterval(
                    displayNextPhoto,
                    5000
                );


            refreshTimer =
                setInterval(
                    refreshImages,
                    10000
                );


        } catch (error) {

            status.textContent =
                "Error: " +
                error.message;

        }

    }


    /*
     * FULL SCREEN
     */

    document.getElementById(
        "fullscreenButton"
    ).addEventListener(
        "click",
        async function () {

            try {

                await document.documentElement.requestFullscreen();

            } catch (error) {

                console.error(
                    "Could not enter full screen:",
                    error
                );

            }

        }
    );


    document.getElementById(
        "exitFullscreenButton"
    ).addEventListener(
        "click",
        async function () {

            try {

                await document.exitFullscreen();

            } catch (error) {

                console.error(
                    "Could not exit full screen:",
                    error
                );

            }

        }
    );


    document.addEventListener(
        "fullscreenchange",
        function () {

            const enterButton =
                document.getElementById(
                    "fullscreenButton"
                );


            const exitButton =
                document.getElementById(
                    "exitFullscreenButton"
                );


            if (document.fullscreenElement) {

                enterButton.style.display =
                    "none";

                exitButton.style.display =
                    "block";

            } else {

                enterButton.style.display =
                    "block";

                exitButton.style.display =
                    "none";

            }

        }
    );


    document.getElementById(
        "connect"
    ).addEventListener(
        "click",
        connectDropbox
    );


    document.getElementById(
        "start"
    ).addEventListener(
        "click",
        startSlideshow
    );


    const params =
        new URLSearchParams(
            window.location.search
        );


    const code =
        params.get("code");


    if (code) {

        exchangeCodeForToken(code)
            .catch(error => {

                document.getElementById(
                    "setup"
                ).innerHTML =
                    "<h1>Dropbox connection failed</h1><p>" +
                    error.message +
                    "</p>";

            });


    } else if (
        sessionStorage.getItem(
            "dropbox_access_token"
        )
    ) {

        showFolderSetup();

    }

</script>

</body>
</html>
